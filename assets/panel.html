function renderTrainResults(r){
  const box=$('#train-results'); box.innerHTML='';
  const m=r.metrics||{};
  const entries=[];
  if(r.task==='regression'){ entries.push(['metric_r2',m.r2],['metric_rmse',m.rmse],['metric_mae',m.mae]); }
  else if(r.task==='classification'){ entries.push(['metric_accuracy',m.accuracy],['metric_precision',m.precision],['metric_recall',m.recall],['metric_f1',m.f1]); }
  else if(r.task==='clustering'){ entries.push(['metric_inertia',m.inertia],['metric_silhouette',m.silhouette],['tr_n_clusters',(r.summary&&r.summary.nClusters)||r.predictions.clusterCount]); }
  else { entries.push(['metric_evr', m.explainedVarianceRatio ? m.explainedVarianceRatio.map(v=>v.toFixed(3)).join(', ') : '']); }
  const mcards=document.createElement('div'); mcards.className='metric-cards';
  for(const [tk,val] of entries){
    const card=document.createElement('div'); card.className='metric-card';
    const vd=document.createElement('div'); vd.className='mv';
    vd.textContent = (typeof val==='number') ? (Math.abs(val)<1&&val!==0 ? val.toFixed(4) : val.toFixed(2)) : String(val);
    const ld=document.createElement('div'); ld.className='ml'; ld.textContent=t(tk);
    card.appendChild(vd); card.appendChild(ld); mcards.appendChild(card);
  }
  box.appendChild(mcards);

  if(r.history && r.history.length>1){
    const grid=document.createElement('div'); grid.className='tr-grid';
    grid.appendChild(trPanel(t('tr_loss_curve'), drawLineChart(r.history.map(h=>h.loss), '#4f8cff')));
    if(r.history[0] && r.history[0].gradNorm!==undefined) grid.appendChild(trPanel(t('tr_grad_curve'), drawLineChart(r.history.map(h=>h.gradNorm), '#ff9f43')));
    box.appendChild(grid);
  }

  const viz=r.viz||{};
  if(r.task==='regression' && viz.points && viz.points.length){
    const c=drawScatter(makeCanvas(560,280), viz.points); box.appendChild(trPanel(t('tr_regress_scatter'), c));
  }
  if(r.task==='classification'){
    if(r.confusion && r.confusion.matrix) box.appendChild(trPanel(t('tr_confusion'), drawConfusionTable(r.confusion.matrix, r.confusion.labels||[])));
    if(viz.points && viz.points.length) box.appendChild(trPanel(t('tr_regress_scatter'), drawScatter(makeCanvas(560,280), viz.points, viz.pointLabels)));
    if(viz.boundary && viz.boundary.grid) box.appendChild(trPanel(t('tr_boundary'), drawBoundary(viz)));
  }
  if(r.task==='clustering' && viz.points){
    const c=drawScatter(makeCanvas(560,280), viz.points, viz.pointLabels); box.appendChild(trPanel(t('tr_cluster_scatter'), c));
  }
  if(r.task==='reduction' && viz.projections){
    const c=drawScatter(makeCanvas(560,280), viz.projections, viz.pointLabels); box.appendChild(trPanel(t('tr_pca_plot'), c));
  }
  if(r.summary && r.summary.layers && r.summary.layers.length){
    box.appendChild(trPanel(t('tr_mlp_flow'), drawMlpFlow(r.summary.layers)));
  }
}
function drawBoundary(viz){
  const b=viz.boundary; const res=b.xs.length;
  const c=makeCanvas(560,320); const ctx=c.getContext('2d'); const w=c.width,h=c.height;
  const pad={l:44,r:14,t:16,b:30};
  const xMin=b.xs[0], xMax=b.xs[res-1], yMin=b.ys[0], yMax=b.ys[res-1];
  const pal=['#4f8cff','#ff9f43','#2dd4a7','#f85149','#a78bfa','#e3b341','#56d4dd','#f778ba'];
  const pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
  const cellW=pw/res, cellH=ph/res;
  ctx.fillStyle='var(--bg)'; ctx.fillRect(0,0,w,h);
  for(let r=0;r<res;r++){
    for(let cc=0;cc<res;cc++){
      const L=b.grid[r][cc]; ctx.fillStyle=pal[(L%pal.length+pal.length)%pal.length]; ctx.globalAlpha=0.5;
      ctx.fillRect(pad.l+cc*cellW, pad.t+(res-1-r)*cellH, cellW+0.6, cellH+0.6);
    }
  }
  ctx.globalAlpha=1;
  trAxis(ctx,w,h,pad,xMin,xMax,yMin,yMax);
  const pts=viz.points||[]; const labels=viz.pointLabels||[];
  pts.forEach((p,i)=>{
    const x=pad.l+(p[0]-xMin)/((xMax-xMin)||1)*pw; const y=pad.t+ph-(p[1]-yMin)/((yMax-yMin)||1)*ph;
    const L=labels[i]||0; ctx.fillStyle=pal[(L%pal.length+pal.length)%pal.length];
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1; ctx.stroke();
  });
  return c;
}

/* ---------- 事件绑定 ---------- */
function bind(){
  // 树
  $('#tree').addEventListener('click',e=>{
    const it=e.target.closest('[data-ds],[data-model]'); if(!it)return;
    if(it.dataset.ds){ state.selDs=it.dataset.ds; state.selCard=null; renderInspector().then(()=>renderTree()); }
    else if(it.dataset.model){ openModel(it.dataset.model); }
  });
  $('#tree-filter').addEventListener('input',()=>renderTree());
  $('#ws-filter').addEventListener('change',applyWsFilter);
  $('#btn-add-root').onclick=async ()=>{
    const path = prompt(t('prompt_root'),'');
    if(!path || !path.trim()) return;
    if(!LIVE){ toast(t('proto_mode_root')); return; }
    try{
      const r = await api('/roots/add', {method:'POST', body:{path:path.trim()}});
      if(r && r.ok){ toast(t('toast_add_root')); await initLive(); await render(); }
      else toast(t('toast_add_fail')+(r&&r.error&&r.error.message||t('unknown_error')));
    }catch(e){ toast(t('toast_add_fail')+e.message); }
  };
  $('#btn-rescan').onclick=async ()=>{
    if(!LIVE){ toast(t('rescan_mock')); renderTree(); return; }
    toast(t('rescanning')); await initLive(); await render(); toast(t('rescan_done'));
  };
  $('#cols-select').addEventListener('change',()=>renderBoard());
  $('#btn-add-chart').onclick=openPicker; $('#btn-empty-add').onclick=openPicker;
  $('#btn-save-view').onclick=saveView;
  $('#btn-new-board').onclick=addBoard;
  $('#btn-md').onclick=exportBoardMarkdown;
  $('#btn-theme').onclick=toggleTheme;
  $('#btn-lang').onclick=()=>{ state.lang=state.lang==='zh'?'en':'zh'; localStorage.setItem('dp.lang', state.lang); applyStaticLang(); render(); };
  $('#btn-settings').onclick=()=>toast(t('settings_toast'));
  $('#btn-upload').onclick=()=>$('#file-input').click();
  $('#file-input').addEventListener('change',e=>{ uploadFiles(e.target.files); e.target.value=''; });
  $('#btn-report').onclick=openReport;
  $('#report-close').onclick=closeReport;
  $('#report-copy').onclick=()=>{ if(lastReportMd){ navigator.clipboard.writeText(lastReportMd).then(()=>toast(t('copy_ok')),()=>toast(t('copy_fail'))); } else toast(t('no_report')); };
  $('#report-download').onclick=downloadReport;
  $('#report-modal').addEventListener('click',e=>{ if(e.target.id==='report-modal')closeReport(); });
  // 模型训练
  $('#btn-train').onclick=openTrain;
  $('#train-close').onclick=closeTrain;
  $('#train-modal').addEventListener('click',e=>{ if(e.target.id==='train-modal')closeTrain(); });
  $('#tf-task').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(b) setTrainTask(b.dataset.task); });
  $('#tf-model').addEventListener('change',e=>{ trainModel=e.target.value; renderTrainParams(); });
  $('#tf-dataset').addEventListener('change',async()=>{ const v=selDataset(); if(v){ try{ await ensureOpen(v); }catch(e){} } updateTrainTargets(); renderTrainFeatures(); });
  $('#tf-target').addEventListener('change',renderTrainFeatures);
  $('#tf-run').onclick=runTraining;
  $('#m-close').onclick=closeModal; $('#m-cancel').onclick=closeModal;
  $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal')closeModal(); });
  $('#mv-back').onclick=closeModel;
  $('#mv-fit').onclick=fitView;
  $('#mv-export').onclick=exportGraphSvg;
  $('#mv-info-toggle').onclick=()=>{ const el=$('#mv-info'); showMvInfo(!el.classList.contains('show')); };
  document.addEventListener('click',e=>{ if(e.target.closest('#mv-info-close')) showMvInfo(false); });
  // 检查器动态事件
  $('#inspector').addEventListener('click',e=>{
    const chip=e.target.closest('[data-add]'); if(!chip)return;
    addCard(chip.dataset.add, chip.dataset.ds, chip.dataset.col);
  });
  // 窗口缩放重绘
  let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(drawBoard,150); });
}

/* ---------- 启动 ---------- */
async function boot(){
  applyTheme();
  applyStaticLang();
  bind();
  await initLive();
  if(!LIVE){
    loadLastView();
    // 首屏预置 3 张图 + 展示能力（仅 mock 模式）
    if(!state.board.length){
      addCard('hist','train','loss');
      addCard('box','train','lr');
      addCard('corr','train','acc');
      addCard('scatter','sales','price',{density:true});
      // 跨工作区叠加演示：valid loss 叠加到 train loss 直方图
      const first=state.board[0]; first.opts.overlay=[{dsId:'valid',col:'loss',label:'valid.parquet / loss'}]; first.title='loss 分布 / train vs valid';
    }
  }
  await render();
}
boot();
</script>
