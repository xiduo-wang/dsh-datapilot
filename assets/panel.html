<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataPilot / 数据工作台 — 交互原型</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2128; --bg4:#21262d;
  --line:#30363d; --line2:#3d444d;
  --text:#c9d1d9; --text2:#8b949e; --text3:#9198a1;
  --accent:#4f8cff; --accent2:#58a6ff;
  --ok:#2dd4a7; --warn:#ff9f43; --danger:#f85149;
  --wsA:#4f8cff; --wsB:#ff9f43; --wsC:#7b8794;
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --focus-ring:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
body.light{
  --bg:#ffffff; --bg2:#f6f8fa; --bg3:#eef1f4; --bg4:#e2e6ea;
  --line:#d0d7de; --line2:#c3c9d0;
  --text:#24292f; --text2:#57606a; --text3:#6e7781;
  --shadow:0 4px 16px rgba(0,0,0,.10);
  --focus-ring:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden; transition:background .2s,color .2s;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2); border-radius:6px; border:2px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text3); background-clip:content-box}

/* ---------- topbar ---------- */
#topbar{
  height:48px; flex:0 0 48px; display:flex; align-items:center; gap:8px; padding:0 12px;
  background:var(--bg2); border-bottom:1px solid var(--line); z-index:5;
}
#topbar .brand{display:flex; align-items:center; gap:8px; font-weight:600; margin-right:6px; white-space:nowrap}
#topbar .brand .logo{width:24px;height:24px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff}
#topbar .brand .logo svg{width:15px;height:15px}
#topbar .proto-tag{font-size:10px;color:var(--text2);background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 6px;line-height:16px}
select,input[type=text],input[type=search],input[type=number]{background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;outline:none}
select:focus,input:focus{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.btn{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent); background:var(--bg4)}
.btn:focus-visible{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring)}
.btn:active{background:var(--bg4)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent2); border-color:var(--accent2)}
.btn.primary:focus-visible{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent2)}
.btn.primary:active{background:var(--accent2)}
.btn.mini{padding:2px 7px;font-size:11px;border-radius:5px}
.btn.icon{padding:5px 8px}
.btn.active{border-color:var(--accent); color:var(--accent); background:var(--bg4)}
.btn svg{width:14px;height:14px;flex:0 0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
#topbar .spacer{flex:1}

/* ---------- layout ---------- */
#app{flex:1; display:flex; min-height:0}
#left{width:252px; flex:0 0 252px; background:var(--bg2); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
#center{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative}
#right{width:280px; flex:0 0 280px; background:var(--bg2); border-left:1px solid var(--line); overflow-y:auto; min-height:0}

/* left tree */
#tree-search{padding:8px 10px 4px}
#tree{flex:1; overflow-y:auto; padding:2px 6px 10px}
.tree-group{margin-top:6px}
.tree-group>.g-head{display:flex; align-items:center; gap:6px; padding:4px 6px; cursor:pointer; border-radius:6px; color:var(--text); user-select:none}
.tree-group>.g-head:hover{background:var(--bg3)}
.g-head .caret{width:14px; flex:0 0 14px; display:flex; align-items:center; justify-content:center; color:var(--text2)}
.g-head .caret svg{display:block; transition:transform .15s}
.g-head.open .caret svg{transform:rotate(90deg)}
.g-head .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.g-head .g-name{font-weight:600; flex:0 0 auto; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.g-head .g-path{font-size:10px; color:var(--text3); font-family:ui-monospace,Consolas,monospace; flex:1 1 0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right}
.g-body{display:none; padding-left:16px}
.tree-group.open>.g-body{display:block}
.tree-item{display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:6px; cursor:pointer; color:var(--text2); user-select:none; position:relative}
.tree-item:hover{background:var(--bg3); color:var(--text)}
.tree-item.sel{background:var(--bg4); color:var(--text); outline:1px solid var(--line2)}
.tree-item .ico{width:15px; flex:0 0 15px; display:flex; align-items:center; justify-content:center; color:var(--text3)}
.tree-item .ico svg{width:14px;height:14px}
.tree-item .fname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,Consolas,monospace; font-size:12px}
.tree-item .meta{font-size:10px; color:var(--text3); white-space:nowrap}
.tree-item.model .fname{font-family:inherit; font-weight:500}

/* center */
#board-bar{height:40px; flex:0 0 40px; display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--line); background:var(--bg2)}
#board-bar .v-title{font-weight:600}
#board-bar .v-hint{font-size:11px; color:var(--text3)}
#board-tabs{display:flex; align-items:center; gap:4px; overflow-x:auto; max-width:62%; height:100%; flex:0 1 auto}
#board-tabs::-webkit-scrollbar{height:4px}
.board-tab{display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:5px; border:1px solid var(--line); background:var(--bg3); color:var(--text2); font-size:12px; cursor:pointer; white-space:nowrap; user-select:none; flex:0 0 auto}
.board-tab:hover{border-color:var(--line2)}
.board-tab.active{background:var(--bg4); border-color:var(--accent); color:var(--text); font-weight:600}
.board-tab .tab-name{max-width:150px; overflow:hidden; text-overflow:ellipsis}
.board-tab .tab-close{display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; padding:0; border:none; background:none; color:var(--text3); font-size:13px; line-height:1; cursor:pointer; border-radius:3px}
.board-tab .tab-close:hover{background:var(--line); color:var(--text)}
#board-wrap{flex:1; overflow:auto; padding:14px; min-height:0}
#board{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:start}
#board.cols2{grid-template-columns:repeat(2,1fr)}
#board.cols4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--bg2); border:1px solid var(--line); border-radius:4px; overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card.selected{border-color:var(--accent)}
.card .c-head{display:flex; align-items:center; gap:6px; padding:7px 10px; cursor:grab; user-select:none; border-bottom:1px solid var(--line)}
.card .c-head .src{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.card .c-head .c-title{flex:1; font-weight:600; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.card .c-head .c-sub{font-size:10px;color:var(--text3);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .c-head button{border:none;background:none;color:var(--text2);cursor:pointer;padding:3px 4px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.card .c-head button svg{width:13px;height:13px}
.card .c-head button:hover{color:var(--text); background:var(--bg3)}
.card .c-head button:focus-visible{outline:none; box-shadow:var(--focus-ring)}
.card canvas{display:block; width:100%}
.card .c-note{position:absolute}
.card.dragging{opacity:.5; border-style:dashed}
#board .drop-hint{outline:2px dashed var(--accent); outline-offset:2px}

/* empty state */
#empty{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
#empty .box{text-align:center; color:var(--text2); pointer-events:auto; max-width:420px}
#empty .box h2{color:var(--text); font-size:16px; margin-bottom:8px}
#empty .box p{margin-bottom:14px; color:var(--text2)}
#empty .kbd{font-family:ui-monospace,Consolas,monospace; font-size:11px; background:var(--bg3); border:1px solid var(--line); border-radius:4px; padding:1px 5px}

/* model view */
#modelview{position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column}
#modelview.show{display:flex}
#mv-bar{height:44px; flex:0 0 44px; display:flex; align-items:center; gap:8px; padding:0 12px; border-bottom:1px solid var(--line); background:var(--bg2)}
#mv-canvas{flex:1; position:relative; overflow:hidden; background:
  radial-gradient(circle, var(--line) 1px, transparent 1px); background-size:24px 24px; min-height:0}
#mv-svg-wrap{position:absolute; inset:0}
svg.graph{width:100%; height:100%}
svg.graph .node rect{fill:var(--bg3); stroke:var(--line2); stroke-width:1; cursor:pointer}
svg.graph .node text{fill:var(--text); font-size:11px}
svg.graph .node .op{fill:var(--accent2); font-size:9px}
svg.graph .node .shape{fill:var(--text3); font-size:9px}
svg.graph .edge{stroke:var(--line2); fill:none; stroke-width:1}
svg.graph .edge.hl{stroke:var(--accent); stroke-width:1.6}
svg.graph .node.dim{opacity:.12}
svg.graph .node.sel rect{stroke:var(--accent); stroke-width:2}
svg.graph .node.anc rect{stroke:var(--danger)}
svg.graph .node.desc rect{stroke:var(--ok)}
#mv-info{position:absolute; left:12px; top:56px; background:var(--bg2); border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-size:11px; color:var(--text2); min-width:210px; max-width:340px; box-shadow:var(--shadow); display:none}
#mv-info.show{display:block}
#mv-info .mi-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
#mv-info .mi-head b{font-size:12px}
#mv-info b{color:var(--text)}
#mv-legend{position:absolute; left:12px; bottom:12px; background:var(--bg2); border:1px solid var(--line); border-radius:4px; padding:6px 10px; font-size:10px; color:var(--text2); display:flex; gap:12px}
#mv-legend .sw{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:-1px}

/* right inspector */
#inspector{padding:12px; display:flex; flex-direction:column; gap:12px}
.ins-sec{}
.ins-sec h4{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text3); margin-bottom:6px}
.kv{display:flex; justify-content:space-between; gap:10px; padding:2px 0; font-size:12px}
.kv .k{color:var(--text2)}
.kv .v{color:var(--text); font-family:ui-monospace,Consolas,monospace; text-align:right; overflow:hidden; text-overflow:ellipsis}
.badge{display:inline-block; font-size:10px; padding:1px 6px; border-radius:3px; background:var(--bg4); color:var(--text2); border:1px solid var(--line)}
.badge.ok{color:var(--ok); border-color:var(--ok)}
.badge.warn{color:var(--warn); border-color:var(--warn)}
.badge.danger{color:var(--danger); border-color:var(--danger)}
.col-row{border:1px solid var(--line); border-radius:4px; padding:6px 8px; margin-bottom:6px; background:var(--bg3)}
.col-row .col-name{display:flex; justify-content:space-between; align-items:center; font-size:12px}
.col-row .col-name .nm{font-family:ui-monospace,Consolas,monospace; font-weight:600}
.col-row .col-stats{font-size:11px; color:var(--text2); margin:4px 0 6px}
.col-row .col-actions{display:flex; gap:4px; flex-wrap:wrap}
.mini-legend{display:flex; flex-wrap:wrap; gap:3px}
.mini-legend .b{width:10px;height:10px;border-radius:2px}
.divider{height:1px; background:var(--line); margin:2px 0}

/* modal */
#modal{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; place-items:center; z-index:50}
#modal.show{display:grid}
#modal .m-box{background:var(--bg2); border:1px solid var(--line); border-radius:6px; width:min(560px,92vw); max-height:78vh; display:flex; flex-direction:column; box-shadow:var(--shadow)}
#modal .m-head{display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
#modal .m-head h3{flex:1; font-size:14px}
#modal .m-body{padding:14px 16px; overflow-y:auto}
#modal .m-foot{padding:10px 16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px}
#report-modal{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; place-items:center; z-index:50}
#report-modal.show{display:grid}
#report-modal .m-box{background:var(--bg2); border:1px solid var(--line); border-radius:6px; width:min(880px,94vw); max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow)}
#report-modal .m-head{display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
#report-modal .m-head h3{flex:1; font-size:14px}
#report-modal .m-body{padding:16px; overflow-y:auto; font-size:12px; line-height:1.65}
#report-modal .m-foot{padding:10px 16px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px}

/* 模型训练 */
#train-modal{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; place-items:center; z-index:50}
#train-modal.show{display:grid}
#train-modal .m-box{background:var(--bg2); border:1px solid var(--line); border-radius:6px; width:min(1000px,96vw); max-height:92vh; display:flex; flex-direction:column; box-shadow:var(--shadow)}
#train-modal .m-head{display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
#train-modal .m-head h3{flex:1; font-size:14px}
#train-modal .m-body{padding:16px; overflow-y:auto; font-size:12px; line-height:1.55}
#train-form{display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; padding-bottom:14px; border-bottom:1px solid var(--line)}
#train-form .tf-full{grid-column:1/-1}
#train-form label{display:block; font-size:11px; color:var(--text2); margin-bottom:4px}
#train-form select,#train-form input[type=number],#train-form input[type=text]{width:100%; background:var(--bg3); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:5px 8px; font-size:12px}
#train-form select:focus,#train-form input:focus{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring)}
.task-pills{display:flex; gap:6px; flex-wrap:wrap}
.task-pills .chip.selected{background:var(--accent); color:#fff; border-color:var(--accent)}
.feat-chips{display:flex; flex-wrap:wrap; gap:5px; max-height:96px; overflow-y:auto; border:1px solid var(--line); border-radius:4px; padding:6px}
.feat-chips .chip input{accent-color:var(--accent); margin:0 4px 0 0; vertical-align:middle}
#train-results{margin-top:14px}
.metric-cards{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.metric-card{flex:1; min-width:110px; background:var(--bg3); border:1px solid var(--line); border-radius:4px; padding:8px 12px}
.metric-card .mv{font-size:18px; font-weight:600; font-variant-numeric:tabular-nums}
.metric-card .ml{font-size:11px; color:var(--text2); margin-top:2px}
.tr-chart{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:4px; margin-bottom:12px}
.tr-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tr-panel{background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px}
.tr-panel h4{font-size:12px; margin:0 0 8px; color:var(--text2); font-weight:600}
.tr-panel canvas{width:100%; display:block}
.cm-table{border-collapse:collapse; width:100%; font-size:11px}
.cm-table th,.cm-table td{border:1px solid var(--line); padding:3px 7px; text-align:center}
.cm-table th{background:var(--bg3)}
.cm-table td.diag{background:rgba(45,212,167,.15)}
.mlp-flow{display:flex; align-items:center; gap:6px; overflow-x:auto; padding:10px 4px}
.mlp-flow .lbox{border:1px solid var(--line); border-radius:4px; padding:8px 14px; text-align:center; background:var(--bg3); min-width:64px}
.mlp-flow .lbox .ls{font-size:10px; color:var(--text2)}
.mlp-flow .lbox .ln{font-size:12px; font-weight:600; margin-top:2px}
.mlp-flow .lbox.hot{border-color:var(--accent); box-shadow:var(--focus-ring)}
.mlp-flow .arr{color:var(--text3); font-size:14px}
#train-status{color:var(--text2); font-size:12px; margin:6px 0}
#train-status.err{color:var(--danger)}

#report-body h1{font-size:18px; margin:0 0 10px}
#report-body h2{font-size:15px; margin:18px 0 8px; border-bottom:1px solid var(--line); padding-bottom:4px}
#report-body h3{font-size:13px; margin:12px 0 6px}
#report-body table{border-collapse:collapse; margin:8px 0; width:100%}
#report-body th,#report-body td{border:1px solid var(--line); padding:4px 8px; text-align:left; font-size:11px}
#report-body th{background:var(--bg3)}
#report-body ul{margin:6px 0; padding-left:20px}
#report-body li{margin:2px 0}
#report-body code{font-family:ui-monospace,Consolas,monospace; font-size:11px; background:var(--bg3); padding:1px 4px; border-radius:3px}
.pick-ds{border:1px solid var(--line); border-radius:4px; margin-bottom:8px; overflow:hidden}
.pick-ds .pd-head{padding:6px 10px; background:var(--bg3); cursor:pointer; display:flex; gap:8px; align-items:center}
.pick-ds .pd-head:hover{background:var(--bg4)}
.pick-ds .pd-cols{display:none; padding:6px 8px 8px}
.pick-ds.open .pd-cols{display:block}
.pick-col{display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:6px}
.pick-col:hover{background:var(--bg3)}
.pick-col .pn{flex:1; font-family:ui-monospace,Consolas,monospace; font-size:12px}
.pick-col .pt{font-size:10px; color:var(--text3)}
.chip{font-size:11px; border:1px solid var(--line); background:var(--bg4); color:var(--text); border-radius:5px; padding:2px 7px; cursor:pointer; transition:border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring)}
.chip:active{background:var(--bg3)}

/* toast */
#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--bg3); border:1px solid var(--line2); border-radius:4px; padding:8px 16px; font-size:12px; box-shadow:var(--shadow); transition:transform .2s; z-index:99}
#toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:1080px){
  #left{width:210px;flex-basis:210px}
  #right{width:240px;flex-basis:240px}
  #board{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span>DataPilot <span class="proto-tag" id="mode-badge" data-i18n="mock_mode">原型 / 模拟数据</span></div>
  <select id="ws-filter"><option value="">全部工作区</option></select>
  <button class="btn" id="btn-add-root" data-i18n="root_dir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>根目录</button>
  <button class="btn" id="btn-upload" data-i18n="upload" data-i18n-title="upload_title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上传</button>
  <input type="file" id="file-input" multiple accept=".csv,.tsv,.txt,.json,.jsonl,.ndjson,.parquet,.pq,.xlsx,.xls,.xlsm,.onnx" style="display:none">

<script>
"use strict";
/* =========================================================================
 * DataPilot 交互原型（纯前端、模拟数据、零外部依赖）
 * 结构：状态 state → 渲染 render() → 事件绑定
 * ========================================================================= */

/* ---------- 工具 ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261112);
function norm(m,s){ // Box-Muller
  const u=1-rnd(), v=rnd(); return m + s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}
function gauss(m,s){return ()=>norm(m,s)}
function lognorm(mu,sigma){return ()=>Math.exp(norm(mu,sigma))}
function betaDist(a,b){return ()=>{ // 近似（Johnk）
  let x=Math.pow(rnd(),1/a), y=Math.pow(rnd(),1/b);
  while(x+y>1){x=Math.pow(rnd(),1/a); y=Math.pow(rnd(),1/b)}
  return x/(x+y);
}}
const qsort = a => a.sort((x,y)=>x-y);
function quantile(sorted,q){ if(!sorted.length) return NaN; const p=(sorted.length-1)*q; const lo=Math.floor(p), hi=Math.ceil(p); if(lo===hi) return sorted[lo]; return sorted[lo]+(sorted[hi]-sorted[lo])*(p-lo); }
function mean(a){let s=0;for(const v of a)s+=v;return a.length?s/a.length:NaN}
function std(a,m){if(a.length<2)return 0;let s=0;for(const v of a)s+=(v-m)*(v-m);return Math.sqrt(s/(a.length-1))}

/* ---------- 模拟数据模型 ---------- */
const PALETTE = ['#4f8cff','#ff9f43','#2dd4a7','#f472b6','#a78bfa','#facc15','#38bdf8','#fb7185'];

let WORKSPACES = [
  {id:'wsA', name:'工作区 A / cv',   path:'D:\\projects\\cv',   color:'#4f8cff'},
  {id:'wsB', name:'工作区 B / nlp',  path:'D:\\projects\\nlp',  color:'#ff9f43'},
  {id:'wsC', name:'数据盘（自定义）', path:'D:\\datasets',       color:'#7b8794', custom:true},
];

let DATASETS = [
  {id:'train', ws:'wsA', file:'train.csv',      rows:1204331, cols:27, type:'csv',     size:'1.9 GB',  ext:'csv'},
  {id:'valid', ws:'wsA', file:'valid.parquet',  rows:120433,  cols:27, type:'parquet', size:'210 MB',  ext:'parquet'},
  {id:'test',  ws:'wsB', file:'test.csv',       rows:55000,   cols:19, type:'csv',     size:'84 MB',   ext:'csv'},
  {id:'eval',  ws:'wsB', file:'eval.jsonl',     rows:12000,   cols:23, type:'jsonl',   size:'38 MB',   ext:'jsonl'},
  {id:'sales', ws:'wsC', file:'sales.xlsx',     rows:2100000, cols:15, type:'xlsx',    size:'312 MB',  ext:'xlsx'},
];

// 每列一个「分布规格」：gen 是采样器，type 是推断类型，flags 是质量标记
const COL_SPECS = {
  loss:      {type:'float64',  gen:gauss(0.41,0.12), flags:['likely-id']},
  lr:        {type:'float64',  gen:lognorm(-6,0.8),  flags:[]},
  acc:       {type:'float64',  gen:()=>Math.min(0.999,Math.max(0.001,norm(0.923,0.03))), flags:[]},
  epoch:     {type:'int64',    gen:()=>1+Math.floor(rnd()*30), flags:[]},
  batch_size:{type:'int64',    gen:()=>[16,32,64][Math.floor(rnd()*3)], flags:['constant']},
  price:     {type:'float64',  gen:lognorm(4.5,1.1), flags:[]},
  qty:       {type:'int64',    gen:()=>1+Math.floor(rnd()*120), flags:[]},
  score:     {type:'float64',  gen:gauss(0.72,0.18), flags:[]},
  tokens:    {type:'int64',    gen:()=>Math.floor(lognorm(8,0.7)()), flags:[]},
  ema:       {type:'float64',  gen:gauss(0.5,0.2),  flags:[]},
};
const CAT_SPECS = {
  model:   {type:'category', cats:['resnet50','vit_b16','seresnext50','convnext']},
  dataset: {type:'category', cats:['imagenet','cifar100','coco','custom']},
  region:  {type:'category', cats:['华东','华南','华北','西南','海外']},
  channel: {type:'category', cats:['直营','经销','电商','分销']},
  label:   {type:'category', cats:['pos','neg','neutral']},
};
let DS_COLS = {
  train: ['loss','lr','acc','epoch','batch_size','model','dataset'],
  valid: ['loss','lr','acc','epoch','model','dataset'],
  test:  ['score','tokens','label','ema'],
  eval:  ['score','tokens','label','ema'],
  sales: ['price','qty','region','channel'],
};
const MISSING_RATE = { train:{loss:0.02,lr:0.001,acc:0.05}, valid:{loss:0.01}, test:{score:0.08,tokens:0.12}, eval:{score:0.03}, sales:{price:0.01,qty:0.04} };

function wsOf(ds){ return WORKSPACES.find(w=>w.id===ds.ws); }
function dsById(id){ return DATASETS.find(d=>d.id===id); }
function colsOf(ds){ return (DS_COLS[ds.id]||[]); }

// 采样器：numeric 列返回数值数组；category 返回标签数组
function mockSample(dsId, colName, n){
  const ds = dsById(dsId);
  const cat = CAT_SPECS[colName];
  if(cat){ const out=new Array(n); for(let i=0;i<n;i++) out[i]=cat.cats[Math.floor(rnd()*cat.cats.length)]; return {cat:true, cats:cat.cats, values:out}; }
  const spec = COL_SPECS[colName] || {type:'float64', gen:gauss(0.5,0.2)};
  const out=new Float64Array(n); for(let i=0;i<n;i++) out[i]=spec.gen();
  return {cat:false, values:out};
}

// 单列画像（从 20000 采样统计）
function mockProfile(dsId, colName){
  const n=20000;
  const s = mockSample(dsId, colName, n);
  const mr = (MISSING_RATE[dsId]||{})[colName]||0;
  const missing = Math.round(n*mr);
  if(s.cat){
    const counts={}; let distinct=0;
    for(const v of s.values){ if(counts[v]===undefined){counts[v]=0;distinct++;} counts[v]++; }
    const topK = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([value,count])=>({value,count}));
    return {type:'category', count: dsById(dsId).rows, nulls:mr, distinct, topK, cats:s.cats,
      flags:[ distinct<=2?'constant': distinct>n*0.9?'high-cardinality': null ].filter(Boolean)};
  }
  const vals = qsort([...s.values]);
  const m = mean(vals), sd = std(vals,m);
  const qs = {p01:quantile(vals,.01), p05:quantile(vals,.05), p25:quantile(vals,.25), p50:quantile(vals,.5), p75:quantile(vals,.75), p95:quantile(vals,.95), p99:quantile(vals,.99)};
  const iqr = qs.p75-qs.p25;
  const lo=qs.p25-1.5*iqr, hi=qs.p75+1.5*iqr;
  let out15=0, out30=0;
  for(const v of vals){ if(v<qs.p25-1.5*iqr||v>hi) out15++; if(v<qs.p25-3*iqr||v>qs.p75+3*iqr) out30++; }
  // 32 桶直方
  const h32=new Array(32).fill(0); const rng=vals[vals.length-1]-vals[0]||1;
  for(const v of vals){ let b=Math.floor((v-vals[0])/rng*32); if(b>=32)b=31; if(b<0)b=0; h32[b]++; }
  // 偏度 / 峰度
  let s3=0,s4=0; for(const v of vals){const z=(v-m)/(sd||1); s3+=z*z*z; s4+=z*z*z*z;}
  const skew = s3/vals.length, kurt = s4/vals.length-3;
  return {type:'float64', count:dsById(dsId).rows, nulls:mr, distinct: Math.min(dsById(dsId).rows, 9000+Math.floor(rnd()*1000)),
    min:vals[0], max:vals[vals.length-1], mean:m, std:sd, qs, outliers:{out15,out30}, histogram32:h32, skew, kurt,
    flags:[ out15/n>0.1?'high-cardinality': null ].filter(Boolean)};
}

/* =========================================================================
 * 双模数据层：live（真实 /api/dsh-datapilot/* 数据引擎） + mock 降级
 * ========================================================================= */
const API_BASE = '/api/dsh-datapilot';
let LIVE = null;            // null=mock；否则 { roots, openCache:{path→datasetId}, schema:{path→{col→type}}, profiles:{path→{col→p}} }
let schemaMap = {};         // dsId → { colName: type }（两种模式都填，供 isNumeric 用）
let modeBadge = 'mock';

function humanSize(b){ if(b==null||b==='')return ''; if(b>=1e9)return (b/1e9).toFixed(1)+' GB'; if(b>=1e6)return (b/1e6).toFixed(1)+' MB'; if(b>=1e3)return (b/1e3).toFixed(1)+' KB'; return b+' B'; }

/* 后端错误/原因文本是中文；英文模式下按已知模式翻译，未知原样返回 */
const ERR_EN=[
  [/^不是有效的 zip\/xlsx（找不到 EOCD）$/,'Not a valid zip/xlsx (EOCD not found)'],
  [/^zip 本地头损坏:\s*(.*)$/,'Corrupt zip local header: $1'],
  [/^zip 压缩方法 (\d+) 不受支持（仅 stored\/deflate）$/,'Unsupported zip compression method $1 (only stored/deflate)'],
  [/^这是旧版 \.xls（BIFF\/OLE）文件，暂不支持，请用 Excel 另存为 \.xlsx$/,'Legacy .xls (BIFF/OLE) is not supported — save it as .xlsx in Excel'],
  [/^不是有效的 xlsx（缺少 xl\/workbook\.xml）$/,'Not a valid xlsx (missing xl/workbook.xml)'],
  [/^(xlsx|xls) 中没有可读取的工作表$/,'No readable worksheet in $1'],
  [/^缺少 \.xls 解析依赖（xlsx 包未安装），请先安装$/,'Missing .xls parser (xlsx package not installed)'],
  [/^xls 解析失败：(.*)$/,'xls parse failed: $1'],
  [/^JSON 解析失败：(.*)$/,'JSON parse failed: $1'],
  [/^缺少 hyparquet 依赖.*$/,'Missing hyparquet dependency: run npm install hyparquet hyparquet-compressors'],
  [/^protobuf varint 越界$/,'protobuf varint out of range'],
  [/^ONNX 文件中没有 graph 字段$/,'ONNX file has no graph field'],
  [/^不是有效的 \.onnx 文件[：:]?\s*(.*)$/,'Not a valid .onnx file: $1'],
  [/^文件不存在[：:]?\s*(.*)$/,'File not found: $1'],
  [/^没有权限读取[：:]?\s*(.*)$/,'Permission denied: $1'],
];
function trError(msg){
  const s=String(msg||''); let m;
  if((m=s.match(/^不支持的文件类型[：:]\s*(.*)$/))) return t('unsupported_format')+': '+m[1];
  if((m=s.match(/^文件超过\s*(.+?)\s*上限$/))) return tf('too_large_file',{size:m[1]});
  if((m=s.match(/^不支持的 task\/model[：:]\s*(.*)$/))) return t('bad_task_model')+': '+m[1];
  if((m=s.match(/^ONNX 解析失败[：:]\s*(.*)$/))) return t('onnx_failed')+': '+trError(m[1]);
  if(state.lang==='en'){
    for(const [re,rep] of ERR_EN){ if(re.test(s)) return s.replace(re,rep); }
  }
  return s;
}

async function api(path, opts={}){
  const r = await fetch(API_BASE + path, opts);
  const j = await r.json().catch(()=>({ok:false, error:{code:'HTTP', message:'non-json'}}));
  if(!r.ok || j.ok === false) throw new Error(trError((j.error && j.error.message) || ('HTTP '+r.status)));
  return j;
}

function isNumericType(t){ return t==='float64' || t==='int64'; }
function isNumeric(dsId, col){ const t = schemaMap[dsId] && schemaMap[dsId][col]; if(t) return isNumericType(t); const spec = COL_SPECS[col]; return !!(spec && spec.type!=='category'); }

// 把后端 profileColumn 归一化到前端画像形状（含缺失率、topK、qs 完整分位、outliers）
function normalizeProfile(p, colName){
  const numeric = p && isNumericType(p.type);
  const total = (p && (p.count + (p.nullCount||0))) || 0;
  const nullRate = total > 0 ? (p.nullCount||0)/total : 0;
  if(!numeric){
    return { type:'category', count: p ? p.count : 0, nulls: nullRate, distinct: p ? (p.distinct||0) : 0,
      topK: (p && p.top) ? p.top : [], flags:[] };
  }
  const qs = { p01:p.p01, p05:p.p05, p25:p.p25, p50:p.p50, p75:p.p75, p95:p.p95, p99:p.p99 };
  return { type: p.type, count: p.count||0, nulls: nullRate, distinct: p.distinct||0,
    min:p.min, max:p.max, mean:p.mean, std:p.std, qs, outliers:{out15:0, out30:0}, histogram32:null, skew:null, kurt:null, flags:[] };
}

// 惰性 open：按文件路径打开数据集，缓存 datasetId + schema + DS_COLS + schemaMap
async function ensureOpen(path, sheet){
  if(LIVE && LIVE.openCache[path] && sheet===undefined) return LIVE.openCache[path];
  if(!LIVE) return path; // mock：dsId 即行内 id
  const body = { path };
  if(sheet!==undefined && sheet!==null && sheet!=='') body.parse = { sheet };
  const j = await api('/datasets/open', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
  const id = j.datasetId;
  LIVE.openCache[path] = id;
  const schema = {};
  const cols = [];
  for(const c of (j.schema||[])){ schema[c.name] = c.type; cols.push(c.name); }
  LIVE.schema[path] = schema;
  schemaMap[path] = schema;
  DS_COLS[path] = cols;
  // 回填数据集规模
  const d = DATASETS.find(x => x.id === path);
  if(d){ d.rows = j.rowCount; d.cols = j.columnCount; if(j.sheets) d.sheets = j.sheets; d.sheetName = j.sheet; d.warnings = j.warnings||[]; }
  return id;
}

async function sample(dsId, colName, n){
  if(LIVE){
    try {
      const id = await ensureOpen(dsId);
      const j = await api('/datasets/sample?id='+encodeURIComponent(id)+'&column='+encodeURIComponent(colName)+'&n='+(n||12000));
      return j.categorical ? {cat:true, cats:j.cats||[], values:j.values} : {cat:false, values:new Float64Array(j.values||[])};
    } catch(e){ console.warn('[datapilot] sample fallback to mock:', e); }
  }
  return mockSample(dsId, colName, n);
}

async function profile(dsId, colName){
  if(LIVE){
    try {
      const id = await ensureOpen(dsId);
      const j = await api('/datasets/profile?id='+encodeURIComponent(id)+'&columns='+encodeURIComponent(colName));
      const p = (j.profiles||[])[0];
      if(p && !p.error) return normalizeProfile(p, colName);
    } catch(e){ console.warn('[datapilot] profile fallback to mock:', e); }
  }
  return mockProfile(dsId, colName);
}

// 一次取全列画像（供检查器 / 选择器 / 相关矩阵 / 缺失矩阵）
async function profileAll(dsId){
  if(!LIVE){
    const out = {}; for(const cn of colsOf(dsById(dsId))) out[cn] = mockProfile(dsId, cn); return out;
  }
  try {
    const id = await ensureOpen(dsId);
    const j = await api('/datasets/profile?id='+encodeURIComponent(id));
    const out = {};
    for(const p of (j.profiles||[])) if(p && !p.error) out[p.name] = normalizeProfile(p, p.name);
    return out;
  } catch(e){ console.warn('[datapilot] profileAll fallback:', e); return {}; }
}

// 真实相关矩阵（数值列两两）
async function correlationMatrix(dsId){
  if(!LIVE){
    const names = colsOf(dsById(dsId)).filter(cn => COL_SPECS[cn] && COL_SPECS[cn].type!=='category');
    const R = names.map((_,i)=>names.map((__,j)=> i===j?1 : (i*j%7-3)*0.18 + (Math.abs(i-j)===1?0.4:0)));
    return { labels: names, matrix: R };
  }
  try {
    const id = await ensureOpen(dsId);
    const j = await api('/datasets/correlation?id='+encodeURIComponent(id));
    return { labels: j.labels||[], matrix: j.matrix||[] };
  } catch(e){ console.warn('[datapilot] correlation fallback:', e); return { labels:[], matrix:[] }; }
}

// 缺失率映射（colName → 0..1）
async function missingRates(dsId){
  if(!LIVE){ return MISSING_RATE[dsId]||{}; }
  const all = await profileAll(dsId);
  const out = {}; for(const k in all) out[k] = all[k].nulls; return out;
}

// 探测并初始化 live 模式；失败则保持 mock
async function initLive(){
  try {
    const h = await api('/health');
    if(h.plugin !== 'dsh-datapilot') return false;
    const st = await api('/state');
    const WS_COLORS = ['#4f8cff','#ff9f43','#2dd4a7','#a78bfa','#38bdf8'];
    LIVE = { roots: st.roots||[], openCache:{}, schema:{}, profiles:{} };
    WORKSPACES = LIVE.roots.map((r,i)=>({ id:r.id, name:r.id==='uploads' ? t('upload_root') : (r.label||r.path), raw:r.label, path:r.path, color:WS_COLORS[i%WS_COLORS.length], custom:false }));
    DATASETS = []; MODELS = []; DS_COLS = {}; schemaMap = {};
    for(const r of LIVE.roots){
      try {
        const s = await api('/scan?rootId='+encodeURIComponent(r.id));
        for(const e of (s.entries||[])){
          if(e.kind === 'model'){
            MODELS.push({ id:e.path, ws:r.id, file:e.name, kind:'onnx', size:humanSize(e.size), meta:{} });
          } else {
            DATASETS.push({ id:e.path, ws:r.id, file:e.name, rows:'?', cols:'?', type:e.format, size:humanSize(e.size), ext:e.format, supported:e.supported });
          }
        }
      } catch(err){ console.warn('[datapilot] scan failed for', r.id, err); }
    }
    modeBadge = 'live';
    return true;
  } catch(e){
    console.warn('[datapilot] live API unavailable, using mock data:', e && e.message);
    return false;
  }
}

/* ---------- 模型（模拟 ONNX 图 / 图纸） ---------- */
let MODELS = [
  {id:'resnet', ws:'wsA', file:'resnet50.onnx', kind:'onnx', size:'98 MB', meta:{ir:7, opset:17, producer:'pytorch 2.3', params:'25.6M', in:'[1,3,224,224]', out:'[1,1000]'}},
  {id:'bert',   ws:'wsB', file:'bert-base.onnx', kind:'onnx', size:'438 MB', meta:{ir:8, opset:17, producer:'transformers', params:'110M', in:'[1,128]', out:'[1,768]'}},
  {id:'arch',   ws:'wsA', file:'arch.png', kind:'image', size:'212 KB', meta:{producer:'draw.io', in:'-', out:'-'}},
];
function buildGraph(which){
  const ns=[], es=[]; let c=0;
  const add=(op,name,shape)=>{ const n={id:'n'+(c++), op, name, shape, ins:[], outs:[]}; ns.push(n); return n; };
  const link=(a,b)=>{ if(a){ a.outs.push(b.id); b.ins.push(a.id); es.push([a.id,b.id]); } return b; };
  if(which==='bert'){
    let p=add('Input','input_ids',[1,128]);
    const em=link(p, add('Gather','token_embed',[128,768]));
    const pe=link(p, add('Gather','pos_embed',[128,768]));
    const add0=add('Add','embed_add',[1,128,768]); link(em,add0); link(pe,add0);
    p=add0;
    for(let L=0;L<3;L++){
      const q=link(p, add('MatMul','q_'+L,[128,768])); const k=link(p, add('MatMul','k_'+L,[128,768])); const v=link(p, add('MatMul','v_'+L,[128,768]));
      const att=link(q, add('Softmax','attn_'+L,[128,128]));
      const ctx=add('MatMul','ctx_'+L,[128,768]); link(att,ctx); link(v,ctx);
      const proj=link(ctx, add('MatMul','proj_'+L,[128,768]));
      const res=add('Add','res_'+L,[1,128,768]); link(p,res); link(proj,res);
      const ln=link(res, add('LayerNorm','ln_'+L,[768]));
      const f1=link(ln, add('MatMul','ff_'+L+'a',[128,3072])); const act=link(f1, add('Gelu','gelu_'+L,null)); const f2=link(act, add('MatMul','ff_'+L+'b',[128,768]));
      const res2=add('Add','res2_'+L,[1,128,768]); link(ln,res2); link(f2,res2);
      p=res2;
    }
    link(p, add('Output','logits',[1,128,30522]));
  } else {
    let p=add('Input','input',[1,3,224,224]);
    const seq=(arr)=>{ for(const [op,name,shape] of arr){ p=link(p, add(op,name,shape)); } };
    seq([['Conv','conv1 7x7',[64,3,7,7]],['BatchNorm','bn1',[64]],['Relu','relu1',null],['MaxPool','pool1',null]]);
    const ch=[64,128,256,512];
    for(let b=0;b<4;b++){
      const C=ch[b]; const start=p;
      seq([['Conv','conv'+b+'_1 1x1',[C,128,1,1]],['BatchNorm','bn'+b+'_1',[C]],['Relu','relu'+b+'_1',null],
           ['Conv','conv'+b+'_2 3x3',[C,C,3,3]],['BatchNorm','bn'+b+'_2',[C]],['Relu','relu'+b+'_2',null],
           ['Conv','conv'+b+'_3 1x1',[C*4,C,1,1]],['BatchNorm','bn'+b+'_3',[C*4]]]);
      const addn=link(p, add('Add','add'+b,[C*4]));
      link(start, addn);
      p=link(addn, add('Relu','relu'+b+'_out',null));
      if(b<3){ p=link(p, add('Conv','down'+b+' 3x3',[C*2,C*4,3,3])); p=link(p, add('MaxPool','pool'+b,null)); }
    }
    seq([['GlobalAveragePool','gap',null],['Flatten','flatten',[512]],['Gemm','fc',[1000,512]],['Softmax','prob',[1000]]]);
    link(p, add('Output','output',[1,1000]));
  }
  // 分层
  const layer={}; for(const n of ns) layer[n.id]=0;
  let changed=true, pass=0;
  while(changed && pass++<ns.length){ changed=false;
    for(const n of ns){ const m = n.ins.length? Math.max(...n.ins.map(i=>layer[i]))+1 : 0; if(m>layer[n.id]){layer[n.id]=m; changed=true;} }
  }
  for(const n of ns) n.layer=layer[n.id];
  return {nodes:ns, edges:es};
}

/* ---------- 绘图：尺规（nice ticks）+ 文本适配 ---------- */
const SANS_STACK='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif';
function niceTicks(min,max,count=5){
  if(!isFinite(min)||!isFinite(max)) return {min:0,max:1,step:1,ticks:[0,1]};
  if(min===max){ const d=Math.abs(min)||1; min-=d/2; max+=d/2; }
  const span=Math.max(max-min,1e-12), raw=span/count;
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step, hi=Math.ceil(max/step-1e-9)*step;
  const ticks=[];
  for(let v=lo; v<=hi+step*1e-6; v+=step) ticks.push(+v.toFixed(10));
  return {min:lo,max:hi,step,ticks};
}
function fmtTick(v){
  if(!isFinite(v)) return '-';
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(a>=1e4) return (v/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  if(a>=1000) return String(Math.round(v));
  if(a>=1) return String(+v.toFixed(2));
  if(a===0) return '0';
  return String(+v.toPrecision(2));
}
function fitText(ctx,txt,maxW){
  if(ctx.measureText(txt).width<=maxW) return txt;
  let lo=1,hi=txt.length;
  while(lo<hi){ const mid=(lo+hi+1)>>1; if(ctx.measureText(txt.slice(0,mid)+'…').width<=maxW) lo=mid; else hi=mid-1; }
  return txt.slice(0,Math.max(1,lo))+'…';
}

async function drawChart(cv, c){
  const dpr=window.devicePixelRatio||1;
  const w=cv.parentElement.clientWidth||320;
  const kind=c.kind;
  const h=(kind==='corr'||kind==='missing')
    ? Math.max(280, Math.min(460, Math.round(w*0.9)+72))
    : (kind==='bar' ? Math.max(260, Math.min(380, Math.round(w*0.72)))
                    : Math.max(250, Math.min(350, Math.round(w*0.68))));
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+'px';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const dark=state.theme==='dark';
  const SUB=dark?'#9198a1':'#6e7781', GRID2=dark?'#262d36':'#e9edf2', AXIS=dark?'#3d444d':'#c3c9d0';
  const pad = kind==='bar' ? {l:52,r:14,t:16,b:54}
            : kind==='corr' ? {l:56,r:16,t:54,b:18}
            : kind==='missing' ? {l:52,r:14,t:16,b:58}
            : {l:52,r:14,t:16,b:36};
  const W=Math.max(10,w-pad.l-pad.r), H=Math.max(10,h-pad.t-pad.b);
  ctx.clearRect(0,0,w,h);
  const col=c.opts.color||PALETTE[0];
  const ds=dsById(c.dsId);

  function axes(){ ctx.strokeStyle=AXIS; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+H); ctx.lineTo(pad.l+W,pad.t+H); ctx.stroke(); }
  function yAxis(min,max,sy){
    const t=niceTicks(min,max,5);
    ctx.font='11px '+SANS_STACK; ctx.fillStyle=SUB; ctx.textAlign='right'; ctx.textBaseline='middle';
    for(const v of t.ticks){ const y=sy(v); if(y<pad.t-1||y>pad.t+H+1) continue;
      ctx.strokeStyle=GRID2; ctx.beginPath(); ctx.moveTo(pad.l+0.5,y); ctx.lineTo(pad.l+W,y); ctx.stroke();
      ctx.fillText(fmtTick(v), pad.l-8, y);
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function xAxisNum(min,max){
    const t=niceTicks(min,max,5);
    ctx.font='11px '+SANS_STACK; ctx.fillStyle=SUB; ctx.textAlign='center'; ctx.textBaseline='top';
    for(const v of t.ticks){ if(v<t.min-1e-9||v>t.max+1e-9) continue;
      const x=pad.l+(v-t.min)/((t.max-t.min)||1)*W;
      ctx.fillText(fmtTick(v), Math.max(pad.l+14,Math.min(pad.l+W-14,x)), pad.t+H+7);
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function xLabel(txt){
    if(!txt) return;
    ctx.font='11px '+SANS_STACK; ctx.fillStyle=SUB; ctx.textAlign='center';
    ctx.fillText(fitText(ctx,txt,W-8), pad.l+W/2, pad.t+H+pad.b-7);
    ctx.textAlign='left';
  }
  function catLabels(labels,centers){
    ctx.font='11px '+SANS_STACK;
    const slot=centers.length>1?Math.abs(centers[1]-centers[0]):W;
    ctx.fillStyle=SUB; ctx.textAlign='center'; ctx.textBaseline='top';
    labels.forEach((l,i)=>ctx.fillText(fitText(ctx,l,Math.max(8,slot-8)), centers[i], pad.t+H+7));
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function empty(msg){
    ctx.fillStyle=SUB; ctx.font='12px '+SANS_STACK; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(msg, pad.l+W/2, pad.t+H/2); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }

  if(kind==='hist'){
    const s=await sample(c.dsId,c.col,12000);
    const vals=[...s.values].filter(v=>!isNaN(v));
    if(!vals.length){ empty(t('no_numeric')); return; }
    const mn=Math.min(...vals), mx=Math.max(...vals);
    const bins=c.opts.bins||40, counts=new Array(bins).fill(0);
    let edgeLo=mn, edgeHi=mx;
    if(c.opts.log){ edgeLo=Math.max(1e-6,mn); edgeHi=Math.max(edgeLo*1.0001,mx);
      const lmn=Math.log(edgeLo), lmx=Math.log(edgeHi);
      for(const v of vals){ let b=Math.floor((Math.log(Math.max(1e-9,v))-lmn)/((lmx-lmn)||1)*bins); if(b>=bins)b=bins-1; if(b<0)b=0; counts[b]++; }
    } else { const bw=(mx-mn)/bins||1; for(const v of vals){ let b=Math.floor((v-mn)/bw); if(b>=bins)b=bins-1; if(b<0)b=0; counts[b]++; } }
    const maxC=Math.max(1,...counts);
    const top=niceTicks(0,maxC,4).max;
    const sy=v=>pad.t+H-v/top*H;
    axes(); yAxis(0,top,sy);
    const barW=W/bins;
    for(let i=0;i<bins;i++){ if(!counts[i]) continue; const bh=counts[i]/top*H;
      ctx.fillStyle=col; ctx.globalAlpha=.92; ctx.fillRect(pad.l+i*barW+0.5, pad.t+H-bh, Math.max(1,barW-1), bh); ctx.globalAlpha=1; }
    const m=mean(vals);
    const mxpos = c.opts.log ? pad.l+(Math.log(Math.max(1e-9,m))-Math.log(edgeLo))/((Math.log(edgeHi)-Math.log(edgeLo))||1)*W
                             : pad.l+(m-mn)/((mx-mn)||1)*W;
    ctx.strokeStyle='#f85149'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(mxpos,pad.t); ctx.lineTo(mxpos,pad.t+H); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='11px '+SANS_STACK; ctx.fillStyle=SUB; ctx.textAlign='left';
    ctx.fillText('μ '+fmtTick(m), Math.min(mxpos+4, pad.l+W-44), pad.t+11);
    if(c.opts.log){
      ctx.font='11px '+SANS_STACK; ctx.fillStyle=SUB; ctx.textAlign='center'; ctx.textBaseline='top';
      const t=niceTicks(edgeLo,edgeHi,4);
      for(const v of t.ticks){ if(v<edgeLo||v>edgeHi) continue;
        const x=pad.l+(Math.log(v)-Math.log(edgeLo))/((Math.log(edgeHi)-Math.log(edgeLo))||1)*W;
        ctx.fillText(fmtTick(v), Math.max(pad.l+14,Math.min(pad.l+W-14,x)), pad.t+H+7); }
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    } else xAxisNum(mn,mx);
    xLabel(c.opts.log? 'log('+c.col+')' : c.col);
  }
  else if(kind==='box'){
    const groups=normGroups(c); const cols=[];
    for(let i=0;i<groups.length;i++){ const g=groups[i]; const sv=await sample(g.dsId,g.col,12000);
      const vals=qsort([...sv.values].filter(v=>!isNaN(v)));
      if(vals.length) cols.push({label:g.label, color:PALETTE[i%PALETTE.length], v:vals}); }
    if(!cols.length){ empty(t('no_numeric')); return; }
    let lo=Infinity,hi=-Infinity; for(const g of cols){ lo=Math.min(lo,g.v[0]); hi=Math.max(hi,g.v[g.v.length-1]); }
    const t=niceTicks(lo,hi,5);
    const sy=v=>pad.t+H-(v-t.min)/((t.max-t.min)||1)*H;
    axes(); yAxis(lo,hi,sy);
    const gw=W/cols.length;
    cols.forEach((grp,i)=>{ const v=grp.v; const q1=quantile(v,.25),q2=quantile(v,.5),q3=quantile(v,.75); const iqr=q3-q1;
      const wlo=Math.max(v[0],q1-1.5*iqr), whi=Math.min(v[v.length-1],q3+1.5*iqr);
      const cx=pad.l+gw*i+gw/2, bw=Math.min(48,gw*0.42);
      ctx.strokeStyle=grp.color; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(cx,sy(whi)); ctx.lineTo(cx,sy(q3)); ctx.moveTo(cx,sy(q1)); ctx.lineTo(cx,sy(wlo)); ctx.stroke();
      ctx.fillStyle=grp.color; ctx.globalAlpha=.22; ctx.fillRect(cx-bw/2,sy(q3),bw,Math.max(1,sy(q1)-sy(q3))); ctx.globalAlpha=1;
      ctx.strokeRect(cx-bw/2,sy(q3),bw,Math.max(1,sy(q1)-sy(q3)));
      ctx.beginPath(); ctx.moveTo(cx-bw/2,sy(q2)); ctx.lineTo(cx+bw/2,sy(q2)); ctx.stroke();
    });
    catLabels(cols.map(g=>g.label), cols.map((_,i)=>pad.l+gw*i+gw/2));
  }
  else if(kind==='violin'){
    const groups=normGroups(c); const cols=[];
    for(let i=0;i<groups.length;i++){ const g=groups[i]; const sv=await sample(g.dsId,g.col,12000);
      const vals=qsort([...sv.values].filter(v=>!isNaN(v)));
      if(vals.length) cols.push({label:g.label, color:PALETTE[i%PALETTE.length], v:vals}); }
    if(!cols.length){ empty(t('no_numeric')); return; }
    let lo=Infinity,hi=-Infinity; for(const g of cols){ lo=Math.min(lo,g.v[0]); hi=Math.max(hi,g.v[g.v.length-1]); }
    const t=niceTicks(lo,hi,5);
    const sy=v=>pad.t+H-(v-t.min)/((t.max-t.min)||1)*H;
    axes(); yAxis(lo,hi,sy);
    const gw=W/cols.length;
    cols.forEach((grp,i)=>{ const v=grp.v; const mn=v[0],mx=v[v.length-1]; const step=(mx-mn)/48||1;
      const kde=[]; const bw2=(mx-mn)/24||1; const jump=Math.max(1,Math.floor(v.length/240));
      for(let k=0;k<=48;k++){ const x=mn+k*step; let sum=0;
        for(let j=0;j<v.length;j+=jump){ const z=(x-v[j])/bw2; sum+=Math.exp(-0.5*z*z); } kde.push(sum); }
      const maxK=Math.max(...kde)||1; const cx=pad.l+gw*i+gw/2, half=Math.min(40,gw*0.34);
      ctx.fillStyle=grp.color; ctx.globalAlpha=.45; ctx.beginPath();
      ctx.moveTo(cx, pad.t+H);
      for(let k=0;k<=48;k++){ const y=pad.t+H-(k/48)*H; ctx.lineTo(cx+(kde[k]/maxK)*half, y); }
      for(let k=48;k>=0;k--){ const y=pad.t+H-(k/48)*H; ctx.lineTo(cx-(kde[k]/maxK)*half, y); }
      ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
    });
    catLabels(cols.map(g=>g.label), cols.map((_,i)=>pad.l+gw*i+gw/2));
  }
  else if(kind==='ecdf'){
    const groups=normGroups(c); const data=[]; let lo=Infinity,hi=-Infinity;
    for(let i=0;i<groups.length;i++){ const g=groups[i]; const sv=await sample(g.dsId,g.col,12000);
      const v=qsort([...sv.values].filter(x=>!isNaN(x))); if(!v.length) continue;
      lo=Math.min(lo,v[0]); hi=Math.max(hi,v[v.length-1]);
      data.push({label:g.label, color:PALETTE[i%PALETTE.length], v}); }
    if(!data.length){ empty(t('no_numeric')); return; }
    axes(); yAxis(0,1,(v)=>pad.t+H-v*H); xAxisNum(lo,hi);
    data.forEach((g,i)=>{ const v=g.v; const step=Math.max(1,Math.floor(v.length/400));
      ctx.strokeStyle=g.color; ctx.lineWidth=1.6; ctx.beginPath();
      for(let j=0;j<v.length;j+=step){ const x=pad.l+(v[j]-lo)/((hi-lo)||1)*W; const y=pad.t+H-(j+1)/v.length*H; if(j===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
      ctx.stroke();
      ctx.font='11px '+SANS_STACK; ctx.fillStyle=g.color; ctx.textAlign='left'; ctx.fillText(fitText(ctx,g.label,W*0.4), pad.l+4, pad.t+12+i*13);
    });
    ctx.textAlign='left';
    xLabel(c.col);
  }
  else if(kind==='bar'){
    const s=await sample(c.dsId,c.col,12000);
    if(!s.cat){ empty(t('bar_need_cat')); return; }
    const counts={}; for(const v of s.values) counts[v]=(counts[v]||0)+1;
    const items=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12);
    if(!items.length){ empty(t('no_data')); return; }
    const top=niceTicks(0,Math.max(...items.map(it=>it[1])),4).max;
    const sy=v=>pad.t+H-v/top*H;
    axes(); yAxis(0,top,sy);
    const bw=W/items.length;
    items.forEach(([k,v],i)=>{ const bh=v/top*H; ctx.fillStyle=col; ctx.globalAlpha=.92;
      ctx.fillRect(pad.l+i*bw+bw*0.15, pad.t+H-bh, Math.max(1,bw*0.7), bh); ctx.globalAlpha=1; });
    catLabels(items.map(it=>it[0]), items.map((_,i)=>pad.l+i*bw+bw/2));
  }
  else if(kind==='line'){
    const groups=normGroups(c); const series=[]; let lo=Infinity,hi=-Infinity;
    for(let i=0;i<groups.length;i++){ const g=groups[i]; const sv=await sample(g.dsId,g.col,60);
      const base=[...sv.values].filter(v=>!isNaN(v)); if(!base.length) continue;
      lo=Math.min(lo,Math.min(...base)); hi=Math.max(hi,Math.max(...base));
      series.push({label:g.label, color:PALETTE[i%PALETTE.length], base}); }
    if(!series.length){ empty(t('no_numeric')); return; }
    const t=niceTicks(lo,hi,5);
    const sy=v=>pad.t+H-(v-t.min)/((t.max-t.min)||1)*H;
    axes(); yAxis(lo,hi,sy); xAxisNum(0,59);
    series.forEach((g,i)=>{ const base=g.base;
      ctx.strokeStyle=g.color; ctx.lineWidth=1.8; ctx.beginPath();
      base.forEach((v,j)=>{ const x=pad.l+(base.length>1? j/(base.length-1):0)*W; const y=sy(v); if(j===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); });
      ctx.stroke();
      ctx.font='11px '+SANS_STACK; ctx.fillStyle=g.color; ctx.textAlign='left'; ctx.fillText(fitText(ctx,g.label,W*0.4), pad.l+4, pad.t+12+i*13);
    });
    ctx.textAlign='left';
    xLabel(c.col? c.col+' / '+t('index') : t('index'));
  }
  else if(kind==='scatter'){
    const sv=await sample(c.dsId,c.col,12000);
    const xa=[...sv.values].filter(v=>!isNaN(v));
    if(!xa.length){ empty(t('no_numeric')); return; }
    const ya=xa.map(v=>v+norm(0,0.3));
    const nx=niceTicks(Math.min(...xa),Math.max(...xa),5), ny=niceTicks(Math.min(...ya),Math.max(...ya),5);
    const sx=v=>pad.l+(v-nx.min)/((nx.max-nx.min)||1)*W;
    const sy=v=>pad.t+H-(v-ny.min)/((ny.max-ny.min)||1)*H;
    axes(); yAxis(Math.min(...ya),Math.max(...ya),sy); xAxisNum(Math.min(...xa),Math.max(...xa));
    ctx.fillStyle=c.opts.density?'#4f8cff':'#2dd4a7';
    const step=Math.max(1,Math.floor(xa.length/4000));
    for(let i=0;i<xa.length;i+=step){ ctx.globalAlpha=c.opts.density?0.15:0.4; ctx.fillRect(sx(xa[i]), sy(ya[i]), 2, 2); }
    ctx.globalAlpha=1;
    xLabel(c.col);
  }
  else if(kind==='corr'){
    const names=colsOf(ds).filter(cn=>isNumeric(ds.id,cn));
    const {labels,matrix}=await correlationMatrix(ds.id);
    const R=matrix&&matrix.length?matrix:null; const useNames=labels&&labels.length?labels:names;
    if(!R||!useNames.length){ empty(t('no_corr')); return; }
    const n=useNames.length;
    const cell=Math.min(W,H)/n, side=cell*n;
    const ox=pad.l+(W-side)/2, oy=pad.t+(H-side)/2;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const v=R[i][j]; const cc=v>=0?mix('#3b82f6','#ffffff',1-v):mix('#ef4444','#ffffff',1+v);
      ctx.fillStyle=cc; ctx.fillRect(ox+j*cell+1, oy+i*cell+1, Math.max(1,cell-2), Math.max(1,cell-2)); }
    if(cell>=44){ ctx.font='10px '+SANS_STACK; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const v=R[i][j]; ctx.fillStyle=Math.abs(v)>0.6?'#fff':'rgba(0,0,0,.55)';
        ctx.fillText(v.toFixed(2), ox+j*cell+cell/2, oy+i*cell+cell/2); } }
    ctx.font='11px '+SANS_STACK; ctx.fillStyle=SUB;
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let i=0;i<n;i++){ ctx.fillText(fitText(ctx,useNames[i],Math.max(8,ox-12)), ox-10, oy+i*cell+cell/2); }
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    for(let j=0;j<n;j++){ ctx.fillText(fitText(ctx,useNames[j],Math.max(8,cell-4)), ox+j*cell+cell/2, oy-6); }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  else if(kind==='missing'){
    const names=colsOf(ds);
    if(!names.length){ empty(t('no_columns')); return; }
    const bands=50, mr=await missingRates(ds.id);
    const cellW=W/names.length, cellH=H/bands;
    for(let i=0;i<names.length;i++){ const mrate=(mr[names[i]]!==undefined?mr[names[i]]:0)||0;
      for(let b=0;b<bands;b++){ const blockMiss=mrate>0?Math.min(1,mrate*3*(0.4+Math.abs(Math.sin(b*0.7+i)))):0;
        ctx.fillStyle = blockMiss>0.5?'#f85149':blockMiss>0.2?'#ff9f43':(dark?'#1b2129':'#eef2f6');
        ctx.fillRect(pad.l+i*cellW+1, pad.t+b*cellH+1, Math.max(1,cellW-2), Math.max(1,cellH-2)); }
    }
    catLabels(names, names.map((_,i)=>pad.l+i*cellW+cellW/2));
  }
}

function mix(a,b,ratio){ // hex a→b
  const pa=hex(a),pb=hex(b); const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*ratio));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function hex(h){h=h.replace('#',''); if(h.length===3)h=h.split('').map(x=>x+x).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

/* ---------- 卡片拖拽排序 ---------- */
let dragEl=null;
function startDrag(e,id){
  if(e.button!==0) return;
  if(e.target.closest('button,input,select,textarea,a')) return; // 交互控件不触发拖拽
  const card=e.target.closest('.card'); if(!card)return;
  const rect=card.getBoundingClientRect(); const ox=e.clientX-rect.left, oy=e.clientY-rect.top;
  const ghost=card.cloneNode(true); ghost.style.cssText='position:fixed;z-index:99;width:'+rect.width+'px;opacity:.6;pointer-events:none;margin:0';
  document.body.appendChild(ghost); card.classList.add('dragging'); dragEl={id,card,ghost,ox,oy};
  const move=ev=>{ ghost.style.left=(ev.clientX-ox)+'px'; ghost.style.top=(ev.clientY-oy)+'px';
    const others=$$('#board .card:not(.dragging)');
    let target=null; for(const o of others){ const r=o.getBoundingClientRect(); if(ev.clientY>r.top && ev.clientY<r.bottom && ev.clientX>r.left && ev.clientX<r.right){target=o;} }
    others.forEach(o=>o.classList.remove('drop-hint')); if(target)target.classList.add('drop-hint');
  };
  const up=ev=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    const target=$$('#board .card.drop-hint')[0]; const board=$('#board'); const from=state.board.findIndex(x=>x.id===id);
    if(target){ const to=state.board.findIndex(x=>x.id===target.dataset.card);
      const [item]=state.board.splice(from,1); state.board.splice(to,0,item);
    }
    ghost.remove(); $$('#board .card').forEach(o=>o.classList.remove('dragging','drop-hint')); renderBoard(); dragEl=null;
  };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

/* ---------- 添加图表 ---------- */
function addCard(kind, dsId, col, opts={}){
  const defaults={hist:{bins:40,log:false}, scatter:{density:false}};
  const card={id:'c'+(state.cardSeq++), kind, dsId, col, opts:Object.assign({}, defaults[kind]||{}, opts),
    title: cardTitleOf(kind, col), auto:true, order: state.board.length};
  state.board.push(card); state.selCard=card.id; state.selDs=null;
  render();
}
function duplicateCard(c){
  if(!c) return;
  // 复制一份图表（含其叠加设置）；若其他数据集有同名列，顺带叠加做跨工作区对比
  const copy={ id:'c'+(state.cardSeq++), kind:c.kind, dsId:c.dsId, col:c.col,
    opts:JSON.parse(JSON.stringify(c.opts||{})), title:c.title, auto:!!c.auto, order:0 };
  const peer=DATASETS.find(d=>d.id!==c.dsId && colsOf(d).includes(c.col));
  if(peer) copy.opts.overlay=(copy.opts.overlay||[]).concat([{dsId:peer.id, col:c.col, label:peer.file+' / '+c.col}]);
  const idx=state.board.findIndex(x=>x.id===c.id);
  if(idx>=0) state.board.splice(idx+1,0,copy); else state.board.push(copy);
  state.selCard=copy.id; state.selDs=null;
  render();
  if(peer) toast(t('toast_overlay')+' '+peer.file+paren(wsOf(peer).name));
  else toast(t('toast_dup'));
}
function deleteCard(id){
  const idx=state.board.findIndex(x=>x.id===id);
  if(idx<0) return;
  state.board.splice(idx,1); // 原地删除，保证与当前看板 cards 是同一数组
  if(state.selCard===id) state.selCard=null;
  render();
}
function sizeBytes(s){
  if(!s) return 0;
  const m=String(s).match(/([\d.]+)\s*(B|KB|MB|GB)/i); if(!m) return 0;
  const n=parseFloat(m[1]); const u=m[2].toUpperCase();
  return u==='GB'? n*1024*1024*1024 : u==='MB'? n*1024*1024 : u==='KB'? n*1024 : n;
}
async function openPicker(){
  const body=$('#m-body'); $('#m-title').textContent=t('add_chart');
  let h='<p style="color:var(--text2);font-size:12px;margin-bottom:10px">'+t('picker_hint')+'</p>';
  for(const ws of WORKSPACES){
    const dss=DATASETS.filter(d=>d.ws===ws.id);
    if(!dss.length)continue;
    h+=`<div class="pick-ds" data-ws="${escapeAttr(ws.id)}"><div class="pd-head"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${ws.color}"></span><b>${escapeHtml(ws.name)}</b></div><div class="pd-cols"></div></div>`;
  }
  body.innerHTML=h;
  $$('.pick-ds',body).forEach(grp=>{
    grp.querySelector('.pd-head').onclick=async()=>{
      grp.classList.toggle('open');
      if(grp.classList.contains('open') && !grp.dataset.loaded){ grp.dataset.loaded='1'; await fillPickerGroup(grp, grp.dataset.ws); }
    };

/* 把后端 /models/meta 的 {nodes,edges} 规范成绘制所需形状（隐藏权重节点，计算分层/邻接）。 */
function normalizeGraph(raw){
  const push=(map,k,v)=>{ const a=map.get(k); if(a)a.push(v); else map.set(k,[v]); };
  const outE=new Map(), inE=new Map();
  for(const e of raw.edges||[]){ push(outE,e.from,e.to); push(inE,e.to,e.from); }
  const nodes=raw.nodes.filter(n=>n.kind!=='weight').map(n=>({
    id:n.id, kind:n.kind, op:n.op||n.kind, name:n.label||n.op||n.kind,
    shape:Array.isArray(n.shape)&&n.shape.length? n.shape.join('×') : (n.shape||null),
    ins:(inE.get(n.id)||[]).filter(i=>raw.nodes.some(x=>x.id===i&&x.kind!=='weight')),
    outs:(outE.get(n.id)||[]).filter(i=>raw.nodes.some(x=>x.id===i&&x.kind!=='weight')),
  }));
  const ids=new Set(nodes.map(n=>n.id));
  const edges=(raw.edges||[]).filter(e=>ids.has(e.from)&&ids.has(e.to)).map(e=>[e.from,e.to]);
  const layer=new Map(nodes.map(n=>[n.id,0]));
  let changed=true, pass=0;
  while(changed && pass++<nodes.length+2){ changed=false;
    for(const n of nodes){
      if(!n.ins.length) continue;
      const m=Math.max(...n.ins.map(i=>layer.get(i)??0))+1;
      if(m>(layer.get(n.id)??0)){ layer.set(n.id,m); changed=true; }
    }
  }
  for(const n of nodes) n.layer=layer.get(n.id)??0;
  return {nodes, edges, live:true};
}
function drawGraph(m,g){
  state.modelMode.graph=g;
  const wrap=$('#mv-svg-wrap'); wrap.innerHTML='';
  const fold=$('#mv-fold').checked;
  const hidden=new Set();
  if(fold){ for(const n of g.nodes){ if(/^(BatchNorm|Relu|MaxPool|Flatten|Softmax|GlobalAveragePool|Gelu|LayerNorm|Add|Concat|Reshape|Transpose|Dropout|Sigmoid|Identity)$/.test(n.op)) hidden.add(n.id); } }
  const visible=g.nodes.filter(n=>!hidden.has(n.id));
  // 坐标（折叠后按可见层压缩编号，避免大空隙）
  const layerW=190, nodeH=44, nodeW=150;
  const visLayers=[...new Set(visible.map(n=>n.layer))].sort((a,b)=>a-b);
  const layerIdx=new Map(visLayers.map((l,i)=>[l,i]));
  const byLayer={}; for(const n of visible){const li=layerIdx.get(n.layer);(byLayer[li]=byLayer[li]||[]).push(n);}
  const pos={};
  for(const k in byLayer){ byLayer[k].forEach((n,i)=>pos[n.id]={x:k*layerW, y:i*(nodeH+12)}); }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','graph');
  const inner=document.createElementNS('http://www.w3.org/2000/svg','g');
  inner.setAttribute('id','g-inner');
  svg.appendChild(inner); wrap.appendChild(svg);
  // edges（折叠时穿透隐藏节点，避免断线）
  const dims=new Map(g.nodes.map(n=>[n.id,n]));
  const outAdj=new Map();
  const pushAdj=(m,k,v)=>{const a=m.get(k); if(a)a.push(v); else m.set(k,[v]);};
  for(const [a,b] of g.edges) pushAdj(outAdj,a,b);
  const links=[];
  const collected=new Set();
  function skipThrough(start){
    const res=[]; const stack=[...((outAdj.get(start)||[]))]; const seen=new Set();
    while(stack.length){
      const cur=stack.pop();
      if(hidden.has(cur)){ if(seen.has(cur))continue; seen.add(cur); for(const nb of (outAdj.get(cur)||[])) stack.push(nb); }
      else res.push(cur);
    }
    return res;
  }
  for(const n of visible){
    for(const b of skipThrough(n.id)){ if(!pos[b])continue; const key=n.id+'>'+b; if(collected.has(key))continue; collected.add(key); links.push([n.id,b]); }
  }
  for(const [a,b] of links){
    const e=document.createElementNS('http://www.w3.org/2000/svg','path');
    const x1=pos[a].x+nodeW, y1=pos[a].y+nodeH/2, x2=pos[b].x, y2=pos[b].y+nodeH/2;
    const mx=(x1+x2)/2;
    e.setAttribute('d',`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    e.setAttribute('class','edge'); e.dataset.edge=[a,b].join('>');
    inner.appendChild(e);
  }
  // nodes
  for(const n of visible){ const p=pos[n.id];
    const gr=document.createElementNS('http://www.w3.org/2000/svg','g');
    gr.setAttribute('class','node'+(n.kind==='input'||n.kind==='output'?' io':'')); gr.dataset.node=n.id; gr.setAttribute('transform',`translate(${p.x},${p.y})`);
    gr.innerHTML=`<rect width="${nodeW}" height="${nodeH}" rx="6"></rect>
      <text x="8" y="16" class="op">${n.op}</text>
      <text x="8" y="30">${n.name.length>18?n.name.slice(0,17)+'…':n.name}</text>
      <text x="8" y="41" class="shape">${n.shape?('['+n.shape+']'):'?'}</text>`;
    gr.style.cursor='pointer';
    gr.onclick=e=>selectNode(n.id, e);
    inner.appendChild(gr);
  }
  // 视图变换
  inner.setAttribute('transform',`translate(${mvTransform.x},${mvTransform.y}) scale(${mvTransform.k})`);
  // 信息
  updateMvInfo(m,g,null);
  renderOpLegend(g);
  fitView();
  // 搜索
  $('#mv-search').oninput=e=>{ const q=e.target.value.toLowerCase(); $$('.node',inner).forEach(nd=>{ const n=g.nodes.find(x=>x.id===nd.dataset.node); nd.classList.toggle('dim', q && !n.name.toLowerCase().includes(q)); }); };
  // 缩放平移
  let panning=false, sx,sy;
  wrap.onwheel=e=>{ e.preventDefault(); const f=e.deltaY<0?1.12:0.89; mvTransform.k=Math.max(0.15,Math.min(3,mvTransform.k*f)); applyT(); };
  wrap.onmousedown=e=>{ if(e.target.closest('.node'))return; panning=true; sx=e.clientX-mvTransform.x; sy=e.clientY-mvTransform.y; };
  window.addEventListener('mousemove',e=>{ if(panning){ mvTransform.x=e.clientX-sx; mvTransform.y=e.clientY-sy; applyT(); }});
  window.addEventListener('mouseup',()=>panning=false);
  $('#mv-fold').disabled=false;
  $('#mv-search').disabled=false;
}
function applyT(){ const inner=$('#g-inner'); if(inner) inner.setAttribute('transform',`translate(${mvTransform.x},${mvTransform.y}) scale(${mvTransform.k})`); }
function selectNode(id,e){
  e.stopPropagation(); const g=state.modelMode.graph; const m=MODELS.find(x=>x.id===state.modelMode.modelId);
  const node=g.nodes.find(x=>x.id===id);
  // 计算上下游
  const anc=new Set(), desc=new Set();
  const walkUp=x=>{ for(const i of x.ins){ if(!anc.has(i)){anc.add(i); const p=g.nodes.find(n=>n.id===i); if(p)walkUp(p);} } };
  const walkDown=x=>{ for(const o of x.outs){ if(!desc.has(o)){desc.add(o); const p=g.nodes.find(n=>n.id===o); if(p)walkDown(p);} } };
  walkUp(node); walkDown(node);
  $$('.node').forEach(nd=>{ nd.classList.remove('sel','anc','desc'); const id=nd.dataset.node;
    if(id===node.id)nd.classList.add('sel'); else if(anc.has(id))nd.classList.add('anc'); else if(desc.has(id))nd.classList.add('desc'); });
  $$('.edge').forEach(ed=>{ const [a,b]=ed.dataset.edge.split('>'); ed.classList.toggle('hl', (anc.has(a)&&anc.has(b))||(desc.has(a)&&desc.has(b))||a===node.id||b===node.id); });
  updateMvInfo(m,g,node);
}

function fitView(){
  const wrap=$('#mv-svg-wrap'); if(!wrap)return;
  const inner=$('#g-inner'); if(!inner)return;
  const rw=wrap.clientWidth||700, rh=wrap.clientHeight||600;
  let bb=null;
  try{ const b=inner.getBBox(); if(isFinite(b.width)&&b.width>0) bb={x:b.x,y:b.y,w:b.width,h:b.height}; }catch(e){}
  if(!bb){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    inner.querySelectorAll('.node').forEach(nd=>{
      const t=nd.getAttribute('transform')||'';
      const m=/translate\(([-\d.eE+]+)[,\s]+([-\d.eE+]+)\)/.exec(t); if(!m)return;
      const x=+m[1], y=+m[2]; if(!isFinite(x)||!isFinite(y))return;
      minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x+150); maxY=Math.max(maxY,y+44);
    });
    if(isFinite(minX)&&isFinite(maxX)) bb={x:minX,y:minY,w:maxX-minX,h:maxY-minY};
  }
  if(!bb||!bb.w)return;
  const k=Math.max(0.2, Math.min((rw-140)/bb.w, (rh-140)/bb.h, 1.2));
  mvTransform={x:(rw-bb.w*k)/2-bb.x*k, y:(rh-bb.h*k)/2-bb.y*k, k};
  applyT();
}

/* ---------- 报告与上传 ---------- */
let lastReportMd = '';
function mdToHtml(md){
  const lines = String(md||'').split('\n');
  const out = [];
  let inUl = false, inTable = false, headerNext = false;
  const inline = s => escapeHtml(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const closeUl = ()=>{ if(inUl){ out.push('</ul>'); inUl=false; } };
  const closeTable = ()=>{ if(inTable){ out.push('</table>'); inTable=false; } };
  for (const raw of lines){
    const line = raw.replace(/\r$/,'');
    if (/^\s*#{1,6}\s/.test(line)){ closeUl(); closeTable(); const lvl=Math.min(3,(line.match(/^#+/)||[''])[0].length); out.push(`<h${lvl}>`+inline(line.replace(/^#+\s*/,''))+`</h${lvl}>`); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)){
      const cells = line.split('|').slice(1,-1).map(c=>c.trim());
      if (cells.every(c=>/^-{2,}$/.test(c))){ continue; }
      if (!inTable){ closeUl(); out.push('<table>'); inTable=true; headerNext=true; }
      if (headerNext){ out.push('<tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr>'); headerNext=false; }
      else out.push('<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>');
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)){ closeTable(); if(!inUl){ out.push('<ul>'); inUl=true; } out.push('<li>'+inline(line.replace(/^\s*[-*]\s+/,''))+'</li>'); continue; }
    if (line.trim()===''){ continue; }
    closeUl(); closeTable(); out.push('<p>'+inline(line)+'</p>');
  }
  closeUl(); closeTable(); return out.join('');
}

const ML_PARAM_DEFS={
  linear:[{k:'lr',tk:'tr_lr',type:'number',def:'0.1',step:'0.01'},{k:'epochs',tk:'tr_epochs',type:'number',def:'300',step:'50'}],
  logistic:[{k:'lr',tk:'tr_lr',type:'number',def:'0.1',step:'0.01'},{k:'epochs',tk:'tr_epochs',type:'number',def:'300',step:'50'}],

};

function setTrainTask(task){
  trainTask=task;
  document.querySelectorAll('#tf-task .chip').forEach(b=>b.classList.toggle('selected', b.dataset.task===task));
  const msel=$('#tf-model'); msel.innerHTML='';
  (ML_TASK_MODELS[task]||[]).forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=mlab(m); msel.appendChild(o); });

function updateTrainTargets(){
  const tsel=$('#tf-target'); tsel.innerHTML='';
  const ds=selDataset(); const cols=ds?colsOf({id:ds}):[];
  if(trainTask==='clustering'||trainTask==='reduction'){ const o=document.createElement('option'); o.value=''; o.textContent='—'; tsel.appendChild(o); tsel.disabled=true; return; }
  tsel.disabled=false;
  let preferred=null;
  for(const c of cols){
    const o=document.createElement('option'); o.value=c; o.textContent=c; tsel.appendChild(o);
    if(!preferred){
      if(trainTask==='classification' && !isNumeric(ds,c)) preferred=c;
      else if(trainTask==='regression' && isNumeric(ds,c)) preferred=c;
    }
  }
  if(preferred) tsel.value=preferred;

function renderTrainFeatures(){
  const wrap=$('#tf-features'); wrap.innerHTML='';

    if(c===target && trainTask!=='clustering' && trainTask!=='reduction') continue;
    const lab=document.createElement('label'); lab.className='chip';

async function runTraining(){
  const ds=selDataset();
  if(!ds){ toast(t('tr_no_dataset')); return; }
  const features=[...document.querySelectorAll('#tf-features input:checked')].map(i=>i.value);
  const target=$('#tf-target').value;
  const noTargetTask = (trainTask==='clustering'||trainTask==='reduction');
  if(!features.length){ toast(t('tr_no_features')); return; }
  if(!noTargetTask && !target){ toast(t('tr_no_target')); return; }
  const params={};
  document.querySelectorAll('#tf-params [data-pk]').forEach(el=>{
    let v=el.value;
    if(el.type==='number') v=parseFloat(v);
    if(el.dataset.pk==='hidden') v=el.value.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n));
    params[el.dataset.pk]=v;
  });
  const payload={ task:trainTask, model:trainModel, features, testSplit:parseFloat($('#tf-split').value)||0.2, seed:parseInt($('#tf-seed').value,10)||42, params };
  if(!noTargetTask){ payload.target=target; payload.targetKind = isNumeric(ds,target)?'numeric':'categorical'; }
  const st=$('#train-status'); st.className=''; st.textContent=t('tr_training');
  $('#train-results').innerHTML='';
  try{
    const backendId = await ensureOpen(ds);
    const j = await api('/ml/train', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(Object.assign({datasetId:backendId}, payload))});
    renderTrainResults(j);
    st.textContent=tf('tr_done',{ms:j.durationMs||0});
  }catch(e){
    st.className='err'; st.textContent=t('tr_failed')+e.message;
  }
}

function trPanel(title, el){ const p=document.createElement('div'); p.className='tr-panel'; const h=document.createElement('h4'); h.textContent=title; p.appendChild(h); if(el) p.appendChild(el); return p; }
function trNote(txt){ const p=document.createElement('p'); p.style.color='var(--text2)'; p.style.fontSize='12px'; p.textContent=txt; return p; }
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; c.style.width='100%'; return c; }
function trAxis(ctx,w,h,pad,xMin,xMax,yMin,yMax,xFmt,yFmt){
  ctx.strokeStyle='var(--line)'; ctx.fillStyle='var(--text2)'; ctx.font='10px '+SANS_STACK;
  const yt=niceTicks(yMin,yMax,5).ticks; const xt=niceTicks(xMin,xMax,5).ticks;
  ctx.lineWidth=1; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(const t of yt){ const y=h-pad.b-(t-yMin)/(yMax-yMin||1)*(h-pad.t-pad.b); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); ctx.fillText(yFmt?yFmt(t):fmtTick(t), pad.l-5, y); }
  ctx.textAlign='center'; ctx.textBaseline='top';
  for(const t of xt){ const x=pad.l+(t-xMin)/(xMax-xMin||1)*(w-pad.l-pad.r); ctx.beginPath(); ctx.moveTo(x,h-pad.b); ctx.lineTo(x,h-pad.b+3); ctx.stroke(); ctx.fillText(xFmt?xFmt(t):fmtTick(t), x, h-pad.b+6); }
}
function drawLineChart(values, color){
  const c=makeCanvas(560,240); const ctx=c.getContext('2d'); const w=c.width,h=c.height,pad={l:44,r:14,t:16,b:26};
  const mn=Math.min(...values), mx=Math.max(...values); const span=(mx-mn)||1;
  ctx.fillStyle='var(--bg)'; ctx.fillRect(0,0,w,h);
  trAxis(ctx,w,h,pad,0,values.length-1,mn-0.05*span,mx+0.05*span);
  ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.beginPath();
  values.forEach((v,i)=>{ const x=pad.l+i/(values.length-1)*(w-pad.l-pad.r); const y=h-pad.b-(v-(mn-0.05*span))/((mx-mn+0.1*span)||1)*(h-pad.t-pad.b); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
  return c;
}
function drawScatter(canvas, pts, labels){
  const ctx=canvas.getContext('2d'); const w=canvas.width,h=canvas.height,pad={l:44,r:14,t:16,b:30};
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const xMin=Math.min(...xs), xMax=Math.max(...xs), yMin=Math.min(...ys), yMax=Math.max(...ys);
  const sx=xMax-xMin||1, sy=yMax-yMin||1;
  ctx.fillStyle='var(--bg)'; ctx.fillRect(0,0,w,h);
  trAxis(ctx,w,h,pad,xMin-0.05*sx,xMax+0.05*sx,yMin-0.05*sy,yMax+0.05*sy);
  const pal=['#4f8cff','#ff9f43','#2dd4a7','#f85149','#a78bfa','#e3b341','#56d4dd','#f778ba'];
  pts.forEach((p,i)=>{
    const x=pad.l+(p[0]-(xMin-0.05*sx))/(sx*1.1)*(w-pad.l-pad.r); const y=h-pad.b-(p[1]-(yMin-0.05*sy))/(sy*1.1)*(h-pad.t-pad.b);
    const l=labels?labels[i]:0; ctx.fillStyle=pal[(l%pal.length+pal.length)%pal.length];
    ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();
  });
  return canvas;
}
function drawConfusionTable(matrix, labels){
  const tbl=document.createElement('table'); tbl.className='cm-table';
  const hr=document.createElement('tr'); const th0=document.createElement('th'); th0.textContent=''; hr.appendChild(th0);
  labels.forEach(l=>{ const th=document.createElement('th'); th.textContent=l; hr.appendChild(th); }); tbl.appendChild(hr);
  matrix.forEach((row,i)=>{
    const tr=document.createElement('tr'); const td0=document.createElement('th'); td0.textContent=labels[i]; tr.appendChild(td0);
    row.forEach((v,j)=>{ const td=document.createElement('td'); if(i===j) td.className='diag'; td.textContent=v; tr.appendChild(td); });
    tbl.appendChild(tr);
  });
  return tbl;
}
function drawMlpFlow(layers){

    if(i>0){ const a=document.createElement('span'); a.className='arr'; a.textContent='→'; wrap.appendChild(a); }
